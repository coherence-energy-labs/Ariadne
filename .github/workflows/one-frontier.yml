name: ONE Frontier focused numerical tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "numpy>=2" "scipy>=1.13" "pytest>=8"
      - name: Focused numerical API tests (not the full repository suite)
        run: python -m pytest -q -o addopts= tests/test_success_contract.py --junitxml=frontier-junit.xml
      - name: Preserve test receipt even when a test fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontier-tests-${{ matrix.os }}-${{ matrix.python }}
          path: frontier-junit.xml
          if-no-files-found: error
          retention-days: 7
  formatting_review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.16.6
      - name: Generate scoped formatting patch without writing to the repository
        run: |
          mkdir frontier-format-review
          python -m ruff check --select I --fix src/ariadne/optimize/success_contract.py src/ariadne/__init__.py tests/test_success_contract.py
          python -m ruff format src/ariadne/optimize/success_contract.py src/ariadne/__init__.py tests/test_success_contract.py
          git diff -- src/ariadne/optimize/success_contract.py src/ariadne/__init__.py tests/test_success_contract.py > frontier-format-review/formatting.patch
          git rev-parse HEAD > frontier-format-review/checkout.txt
      - name: Preserve inspectable patch and source for offline review (no auto-commit)
        uses: actions/upload-artifact@v7
        with:
          name: frontier-format-review
          path: |
            frontier-format-review/
            src/ariadne/
            tests/test_success_contract.py
            pyproject.toml
          if-no-files-found: error
          retention-days: 7
      - name: Refuse formatting drift
        run: git diff --exit-code -- src/ariadne/optimize/success_contract.py src/ariadne/__init__.py tests/test_success_contract.py
