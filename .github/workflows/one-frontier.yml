name: ONE Frontier focused numerical tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "numpy>=2" "scipy>=1.13" "pytest>=8"
      - name: Focused numerical API tests (not the full repository suite)
        run: python -m pytest -q -o addopts= tests/test_success_contract.py
