name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Ariadne
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache SPICE kernels
        uses: actions/cache@v4
        with:
          path: data/kernels
          key: spice-kernels-de440s-v1

      - name: Run fast tests
        run: pytest -m "not slow" -q

      - name: Import smoke check
        run: |
          python -c "import ariadne; print('ariadne', ariadne.__version__)"
          python -c "from ariadne.transport_graph.search import dijkstra; from ariadne.interplanetary.porkchop import lambert_transfer; from ariadne.atlas.store import write_atlas; print('imports OK')"
